<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>measure</title>
<style>html,body{margin:0;padding:0;}</style>
</head>
<body>
<iframe id="f" src="index.html" style="width:100%;height:1200px;border:0;display:block;"></iframe>
<script>
var w = new URLSearchParams(location.search).get('w');
if (w) { var f = document.getElementById('f'); f.style.width = w + 'px'; }
</script>
<script>
function measure() {
  try {
    var d = document.getElementById('f').contentDocument;
    var sw = d.documentElement.scrollWidth;
    var cw = d.documentElement.clientWidth;
    var grid = d.querySelector('.modules-grid');
    var gs = grid ? grid.scrollWidth : -1;
    var gc = grid ? grid.clientWidth : -1;
    var out = 'SW=' + sw + ' CW=' + cw + ' GRID=' + gs + '/' + gc;
    document.title = out;
    document.body.insertAdjacentHTML('beforeend', '<div id="out">' + out + '</div>');
  } catch (e) { document.body.insertAdjacentHTML('beforeend', '<div id="out">ERR ' + e.message + '</div>'); }
}
window.onload = function () { setTimeout(measure, 800); };
</script>
</body>
</html>
